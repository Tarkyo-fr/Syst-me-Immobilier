plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'fr.minenorth'
version = '1.0.0'
base { archivesName = 'minenorth-immo' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { minenorthimmo { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    // Construire d'abord minenorth-api puis minenorth-portes (leurs jars sont lus ici).
    flatDir { dirs '../minenorth-api/build/libs', '../minenorth-portes/build/libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf("blank:minenorth_api:1.0.0")
    implementation fg.deobf("blank:minenorth-portes:1.0.0")
}
jar {
    manifest { attributes([
        'Specification-Title': 'MineNorth Immo',
        'Specification-Vendor': 'MineNorth RP',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'MineNorth RP'
    ]) }
}
jar.finalizedBy('reobfJar')
